# Twitch-логин владельца 7TV-сета
twitch-login: "KledusOfficial"
# Если знаешь Twitch ID - впиши сюда, тогда запрос к decapi.me не нужен
twitch-id: ""

# true  -> стикер вставляется по :имя:
# false -> по голому слову (как в Twitch), может ловить обычные слова
require-colons: true

# Размер одного кадра в пикселях в ресурспаке
sprite-size: 32
# Максимум кадров у анимации (лишние пропускаются, длительность сохраняется)
max-frames: 60

pack:
  # ПУБЛИЧНЫЙ IP или домен твоего сервера, порт должен быть открыт (TCP)
  host: "YOUR.SERVER.IP"
  port: 8765
  # true - игрок без пака не зайдёт / будет кикнут при отказе
  force: false
  prompt: "Ресурспак со стикерами 7TV"
